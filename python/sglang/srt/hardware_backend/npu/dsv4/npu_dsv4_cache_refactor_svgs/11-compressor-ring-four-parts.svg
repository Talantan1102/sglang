<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="190" viewBox="0 0 1640 190" role="img" aria-labelledby="title desc">
  <title id="title">改动二的四个子改动</title>
  <desc id="desc">显式state_loc storage、Eager、Graph/MTP、PD StateType收敛依次完成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "trebuchet ms", Verdana, Arial, sans-serif; fill: #0F172A; text-anchor: middle; font-size: 16px; }
      .changed { fill: #FFF4D6; stroke: #D97706; stroke-width: 1.5; }
      .result { fill: #EEE8FF; stroke: #7C3AED; stroke-width: 2; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <path class="edge" d="M 280 95 H 330"/>
  <path class="edge" d="M 590 95 H 640"/>
  <path class="edge" d="M 900 95 H 950"/>
  <path class="edge" d="M 1270 95 H 1320"/>
  <rect class="changed" x="20" y="48" width="260" height="94" rx="4"/>
  <text x="150" y="78"><tspan x="150">子改动 1</tspan><tspan x="150" dy="24">state_loc storage ownership</tspan><tspan x="150" dy="24">+ 删除 paged allocation</tspan></text>
  <rect class="changed" x="330" y="48" width="260" height="94" rx="4"/>
  <text x="460" y="78"><tspan x="460">子改动 2</tspan><tspan x="460" dy="24">Eager cache_mode=2</tspan><tspan x="460" dy="24">+ 删除 Eager paged metadata</tspan></text>
  <rect class="changed" x="640" y="48" width="260" height="94" rx="4"/>
  <text x="770" y="78"><tspan x="770">子改动 3</tspan><tspan x="770" dy="24">Graph/MTP 显式 loc</tspan><tspan x="770" dy="24">+ 删除剩余 state metadata</tspan></text>
  <rect class="changed" x="950" y="48" width="320" height="94" rx="4"/>
  <text x="1110" y="78"><tspan x="1110">子改动 4</tspan><tspan x="1110" dy="24">PD/StateType 收敛</tspan><tspan x="1110" dy="24">仅保留 NPU C128 KV 特例</tspan></text>
  <rect class="result" x="1320" y="48" width="300" height="94" rx="4"/>
  <text x="1470" y="90"><tspan x="1470">最终：单机与 PD</tspan><tspan x="1470" dy="24">仅使用显式 state_loc ring</tspan></text>
</svg>
