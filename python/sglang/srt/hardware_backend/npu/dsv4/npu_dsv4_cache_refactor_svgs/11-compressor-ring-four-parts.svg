<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="500" viewBox="0 0 2000 500" role="img" aria-labelledby="title desc">
  <title id="title">改动二四个子改动</title><desc id="desc">前三项建立 ring 路径时同步删除对应 paged 逻辑，第四项完成 PD ring bank 传输。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748B"/></marker><style>.h{font:700 25px sans-serif;fill:#0F172A}.p{font:15px sans-serif;fill:#475569}.b{rx:12;ry:12;stroke-width:2}.orange{fill:#FFF4D6;stroke:#D97706}.purple{fill:#EEE8FF;stroke:#7C3AED}.t{font:700 16px sans-serif;fill:#0F172A;text-anchor:middle}.s{font:14px sans-serif;fill:#334155;text-anchor:middle}.e{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <text x="35" y="45" class="h">改动二：四个可独立 review 的子改动</text><text x="35" y="75" class="p">删除是新路径切换的附属动作：1 删除 storage/allocator，2 删除 Eager metadata，3 删除 Graph/MTP 与剩余 table/hooks，4 切换 PD。</text>
  <rect x="35" y="130" width="390" height="180" class="b orange"/><text x="230" y="170" class="t">1. Ring storage ownership</text><text x="230" y="205" class="s">原地修改 NPUCompressStatePool</text><text x="230" y="234" class="s">删除 paged sizing / allocator</text><text x="230" y="263" class="s">删除 state lens / loc</text>
  <rect x="470" y="130" width="390" height="180" class="b orange"/><text x="665" y="170" class="t">2. Eager Ring</text><text x="665" y="205" class="s">每 batch 派生 INT32 bank</text><text x="665" y="234" class="s">cache_mode=2</text><text x="665" y="263" class="s">删除 Eager 写表 / page table</text>
  <rect x="905" y="130" width="390" height="180" class="b orange"/><text x="1100" y="170" class="t">3. Graph + MTP Ring</text><text x="1100" y="205" class="s">固定 bank + replay copy_</text><text x="1100" y="234" class="s">rejected suffix overwrite</text><text x="1100" y="263" class="s">删除剩余 table / hooks</text>
  <rect x="1340" y="130" width="390" height="180" class="b orange"/><text x="1535" y="170" class="t">4. PD Ring Bank</text><text x="1535" y="205" class="s">source → destination bank</text><text x="1535" y="234" class="s">完整 bank 传输</text><text x="1535" y="263" class="s">KV exact page 语义不变</text>
  <rect x="1775" y="145" width="185" height="150" class="b purple"/><text x="1867" y="188" class="t">最终</text><text x="1867" y="222" class="s">单机 + PD</text><text x="1867" y="251" class="s">仅 ring state</text>
  <path d="M425 220H470M860 220H905M1295 220H1340M1730 220H1775" class="e"/>
  <rect x="35" y="365" width="1260" height="85" class="b orange"/><text x="665" y="400" class="t">单机切换的三个 review 边界</text><text x="665" y="429" class="s">每项同时实现新 ownership/consumer 并移除它替代的旧逻辑；不存在独立“删除 allocator/table”阶段</text>
</svg>
