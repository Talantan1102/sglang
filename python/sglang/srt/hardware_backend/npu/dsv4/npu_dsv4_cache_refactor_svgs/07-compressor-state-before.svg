<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="470" viewBox="0 0 2000 470" role="img" aria-labelledby="title desc">
  <title id="title">Compressor state paged 重构前</title>
  <desc id="desc">展示 state length、allocator、output loc、request table、page table 到 cache_mode 1 Compressor 的分页地址链。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
    <style>
      .title{font:700 25px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0F172A}.sub{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.box{rx:10;ry:10;stroke-width:2}.deleted{fill:#FDECEC;stroke:#D14343;stroke-dasharray:7 5}.changed{fill:#FFF4D6;stroke:#D97706}.neutral{fill:#F4F5F7;stroke:#6B7280}.result{fill:#EEE8FF;stroke:#7C3AED}.t{font:600 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0F172A;text-anchor:middle}.s{font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155;text-anchor:middle}.edge{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="40" y="45" class="title">改动二前：Compressor state 使用 paged allocator / request table</text>
  <text x="40" y="74" class="sub">红色节点在改动二完成后删除；橙色节点保留接口并修改实现。分页地址当前沿 request 生命周期持续分配、写表和回收。</text>

  <rect x="40" y="165" width="190" height="92" class="box neutral"/><text x="135" y="201" class="t">ScheduleBatch</text><text x="135" y="226" class="s">Prefill / Decode</text>
  <rect x="275" y="150" width="225" height="122" class="box deleted"/><text x="387" y="187" class="t">DSV4StateLens</text><text x="387" y="214" class="s">alloc_len / offset</text><text x="387" y="239" class="s">watermark</text>
  <rect x="545" y="150" width="245" height="122" class="box deleted"/><text x="667" y="187" class="t">State Allocator</text><text x="667" y="214" class="s">C4 + C128</text><text x="667" y="239" class="s">按 token/page 分配</text>
  <rect x="835" y="150" width="225" height="122" class="box deleted"/><text x="947" y="187" class="t">State Out Loc</text><text x="947" y="214" class="s">out_c4_state_loc</text><text x="947" y="239" class="s">out_c128_state_loc</text>
  <rect x="1105" y="140" width="250" height="142" class="box deleted"/><text x="1230" y="177" class="t">State Request Table</text><text x="1230" y="207" class="s">req_to_token_c4_state</text><text x="1230" y="232" class="s">req_to_token_c128_state</text><text x="1230" y="257" class="s">完整历史映射</text>
  <rect x="1400" y="150" width="230" height="122" class="box deleted"/><text x="1515" y="187" class="t">State Page Table</text><text x="1515" y="214" class="s">INT32[B, max_pages]</text><text x="1515" y="239" class="s">page id，0=skip</text>
  <rect x="1675" y="150" width="275" height="122" class="box changed"/><text x="1812" y="187" class="t">custom.compressor</text><text x="1812" y="214" class="s">cache_mode=1</text><text x="1812" y="239" class="s">paged state_cache</text>

  <path d="M230 211 H275" class="edge"/><path d="M500 211 H545" class="edge"/><path d="M790 211 H835" class="edge"/><path d="M1060 211 H1105" class="edge"/><path d="M1355 211 H1400" class="edge"/><path d="M1630 211 H1675" class="edge"/>

  <rect x="660" y="340" width="680" height="82" class="box changed"/><text x="1000" y="373" class="t">NPUCompressStatePool（保留类与接口）</text><text x="1000" y="399" class="s">当前为 FP32 paged tensor；子改动 1 原地改造成 request ring layout</text>
  <path d="M1340 381 H1812 V272" class="edge"/>
</svg>
