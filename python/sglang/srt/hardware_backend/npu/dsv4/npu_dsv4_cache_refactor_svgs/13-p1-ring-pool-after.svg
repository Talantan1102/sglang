<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="520" viewBox="0 0 1650 520" role="img" aria-labelledby="title desc">
  <title id="title">子改动一重构后：复用GPU ring state pool</title>
  <desc id="desc">分配、ring和地址翻译复用GPU CompressStatePool；NPU只适配FP32、三维view和正数dummy地址。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>text{font-family:"trebuchet ms",Verdana,Arial,sans-serif;fill:#0F172A;text-anchor:middle;font-size:16px}.n{fill:#F4F5F7;stroke:#6B7280;stroke-width:1.5}.r{fill:#E8F1FB;stroke:#3B82F6;stroke-width:1.5}.c{fill:#FFF4D6;stroke:#D97706;stroke-width:1.5}.o{fill:#EEE8FF;stroke:#7C3AED;stroke-width:2}.e{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs>
  <path class="e" d="M260 112H350"/><path class="e" d="M260 372H350"/><path class="e" d="M650 112H730"/><path class="e" d="M650 372H730"/><path class="e" d="M1010 112H1110"/><path class="e" d="M1010 242H1110"/><path class="e" d="M1010 372H1110"/><path class="e" d="M1380 242H1450"/>
  <rect class="n" x="20" y="68" width="240" height="88" rx="4"/><text x="140" y="106"><tspan x="140">SWA physical pages</tspan><tspan x="140" dy="24">full→SWA mapping</tspan></text>
  <rect class="n" x="20" y="328" width="240" height="88" rx="4"/><text x="140" y="366"><tspan x="140">request slots</tspan><tspan x="140" dy="24">position / dummy slot</tspan></text>
  <rect class="r" x="350" y="68" width="300" height="88" rx="4"/><text x="500" y="106"><tspan x="500">swa_loc → C4 state_loc</tspan><tspan x="500" dy="24">不按 request 清 bank</tspan></text>
  <rect class="r" x="350" y="328" width="300" height="88" rx="4"/><text x="500" y="366"><tspan x="500">req + position → C128 state_loc</tspan><tspan x="500" dy="24">首次/复用时清 C128 bank</tspan></text>
  <rect class="r" x="730" y="68" width="280" height="88" rx="4"/><text x="870" y="94"><tspan x="870">[复用 GPU] C4A pool</tspan><tspan x="870" dy="22">SWA page × ring × 2048</tspan><tspan x="870" dy="22">公共分配 / ring / translate</tspan></text>
  <rect class="r" x="730" y="198" width="280" height="88" rx="4"/><text x="870" y="224"><tspan x="870">[复用 GPU] C4Li pool</tspan><tspan x="870" dy="22">SWA page × ring × 512</tspan><tspan x="870" dy="22">公共分配 / ring / translate</tspan></text>
  <rect class="r" x="730" y="328" width="280" height="88" rx="4"/><text x="870" y="354"><tspan x="870">[复用 GPU] C128A pool</tspan><tspan x="870" dy="22">request × ring × 1024</tspan><tspan x="870" dy="22">公共分配 / ring / translate</tspan></text>
  <rect class="c" x="1110" y="188" width="270" height="108" rx="4"/><text x="1245" y="218"><tspan x="1245">NPU 薄适配</tspan><tspan x="1245" dy="22">FP32 / 3-D view</tspan><tspan x="1245" dy="22">positive dummy</tspan><tspan x="1245" dy="22">KV=0，score=-inf</tspan></text>
  <rect class="o" x="1450" y="198" width="180" height="88" rx="4"/><text x="1540" y="236"><tspan x="1540">显式 state_loc</tspan><tspan x="1540" dy="24">无 state allocator</tspan></text>
</svg>
