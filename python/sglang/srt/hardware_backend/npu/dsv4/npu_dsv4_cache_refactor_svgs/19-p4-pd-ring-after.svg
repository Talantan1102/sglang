<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="520" viewBox="0 0 2050 520" role="img" aria-labelledby="title desc">
  <title id="title">子改动四重构后</title><desc id="desc">PD 使用 source 和 destination request bank 重映射完整 C4A、C4Li、C128A ring bank。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748B"/></marker><style>.h{font:700 25px sans-serif;fill:#0F172A}.p{font:15px sans-serif;fill:#475569}.b{rx:12;ry:12;stroke-width:2}.gray{fill:#F4F5F7;stroke:#6B7280}.blue{fill:#E8F1FB;stroke:#3B82F6}.green{fill:#E8F7EE;stroke:#22A06B}.orange{fill:#FFF4D6;stroke:#D97706}.purple{fill:#EEE8FF;stroke:#7C3AED}.t{font:700 16px sans-serif;fill:#0F172A;text-anchor:middle}.s{font:14px sans-serif;fill:#334155;text-anchor:middle}.e{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <text x="35" y="45" class="h">子改动 4 重构后：PD 传输完整 request ring bank</text><text x="35" y="75" class="p">Prefill/Decode 各自计算本地 bank；state component 允许 remap，KV component 继续 exact page-index match。</text>
  <rect x="35" y="110" width="300" height="105" class="b gray"/><text x="185" y="148" class="t">Prefill req_pool_idx</text><text x="185" y="178" class="s">source bank</text>
  <rect x="35" y="315" width="300" height="105" class="b gray"/><text x="185" y="353" class="t">Decode req_pool_idx</text><text x="185" y="383" class="s">destination bank</text>
  <rect x="400" y="110" width="320" height="105" class="b orange"/><text x="560" y="148" class="t">Register state buffers</text><text x="560" y="178" class="s">item_len=one full bank</text>
  <rect x="400" y="315" width="320" height="105" class="b green"/><text x="560" y="353" class="t">Clear destination bank</text><text x="560" y="383" class="s">隔离旧 request 内容</text>
  <rect x="790" y="175" width="330" height="160" class="b blue"/><text x="955" y="213" class="t">State components</text><text x="955" y="243" class="s">DSV4_C4_STATE</text><text x="955" y="270" class="s">per-layer C4A + C4Li</text><text x="955" y="297" class="s">DSV4_C128_STATE / C128A</text><text x="955" y="322" class="s">共享对应 bank index</text>
  <rect x="1190" y="175" width="330" height="160" class="b green"/><text x="1355" y="213" class="t">Ascend bank remap</text><text x="1355" y="243" class="s">src bank != dst bank 允许</text><text x="1355" y="270" class="s">数量与顺序必须一致</text><text x="1355" y="297" class="s">KV exact match 不变</text><text x="1355" y="322" class="s">ring size 两侧一致</text>
  <rect x="1590" y="185" width="280" height="140" class="b orange"/><text x="1730" y="223" class="t">Full bank copy</text><text x="1730" y="253" class="s">source → destination</text><text x="1730" y="280" class="s">C4A/C4Li/C128A</text><text x="1730" y="307" class="s">按 component 搬运</text>
  <rect x="1920" y="195" width="100" height="120" class="b purple"/><text x="1970" y="233" class="t">结果</text><text x="1970" y="263" class="s">继续</text><text x="1970" y="290" class="s">decode</text>
  <path d="M335 162H400M720 162H755V225H790M335 367H400M720 367H755V290H790M1120 255H1190M1520 255H1590M1870 255H1920" class="e"/>
  <rect x="790" y="410" width="730" height="70" class="b blue"/><text x="1155" y="440" class="t">恢复语义</text><text x="1155" y="465" class="s">相同 ring size + committed sequence length；无需 state request table 或额外 cursor</text>
</svg>
