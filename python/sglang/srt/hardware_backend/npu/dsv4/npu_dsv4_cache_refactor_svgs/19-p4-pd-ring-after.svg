<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="570" viewBox="0 0 1580 570" role="img" aria-labelledby="title desc">
  <title id="title">子改动四重构后：PD 与 StateType 收敛</title>
  <desc id="desc">C4、Indexer、SWA 和 compressor state 复用 GPU 通用类型和传输路径，Ascend 只保留 C128 KV 特例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "trebuchet ms", Verdana, Arial, sans-serif; fill: #0F172A; text-anchor: middle; font-size: 16px; }
      .neutral { fill: #F4F5F7; stroke: #6B7280; stroke-width: 1.5; }
      .reused { fill: #E8F1FB; stroke: #3B82F6; stroke-width: 1.5; }
      .changed { fill: #FFF4D6; stroke: #D97706; stroke-width: 1.5; }
      .deleted { fill: #FDECEC; stroke: #D14343; stroke-width: 2; stroke-dasharray: 5 3; }
      .result { fill: #EEE8FF; stroke: #7C3AED; stroke-width: 2; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <path class="edge" d="M 240 92 H 320"/>
  <path class="edge" d="M 240 222 H 320"/>
  <path class="edge" d="M 650 92 C 820 92 820 258 990 258"/>
  <path class="edge" d="M 650 222 H 990"/>
  <path class="edge" d="M 650 352 C 820 352 820 282 990 282"/>
  <path class="edge" d="M 650 482 C 820 482 820 306 990 306"/>
  <path class="edge" d="M 1220 282 H 1280"/>
  <path class="edge" d="M 960 482 C 1160 482 1160 340 1280 310"/>

  <rect class="neutral" x="20" y="58" width="220" height="68" rx="4"/>
  <text x="130" y="98">输入一：full page index</text>
  <rect class="neutral" x="20" y="188" width="220" height="68" rx="4"/>
  <text x="130" y="228">输入二：full→SWA/state index</text>

  <rect class="reused" x="320" y="48" width="330" height="88" rx="4"/>
  <text x="485" y="86"><tspan x="485">[复用] 主 KV 传输</tspan><tspan x="485" dy="24">C4 KV + Indexer K/scale</tspan></text>
  <rect class="reused" x="320" y="178" width="330" height="88" rx="4"/>
  <text x="485" y="216"><tspan x="485">[复用] StateType.SWA</tspan><tspan x="485" dy="24">SWA KV + C4A/C4Li state</tspan></text>
  <rect class="reused" x="320" y="308" width="330" height="88" rx="4"/>
  <text x="485" y="346"><tspan x="485">[复用] StateType.C128_STATE</tspan><tspan x="485" dy="24">C128A state</tspan></text>
  <rect class="changed" x="320" y="438" width="330" height="88" rx="4"/>
  <text x="485" y="476"><tspan x="485">[保留] AscendStateType.DSV4_C128</tspan><tspan x="485" dy="24">独立 C128 KV index</tspan></text>

  <rect class="deleted" x="690" y="438" width="270" height="88" rx="4"/>
  <text x="825" y="476"><tspan x="825">[删除] 其余 5 个</tspan><tspan x="825" dy="24">Ascend 专用 StateType/dispatch</tspan></text>

  <rect class="reused" x="990" y="238" width="230" height="88" rx="4"/>
  <text x="1105" y="276"><tspan x="1105">[复用] GPU 通用 connector</tspan><tspan x="1105" dy="24">按 component 传输</tspan></text>
  <rect class="result" x="1280" y="238" width="280" height="88" rx="4"/>
  <text x="1420" y="276"><tspan x="1420">公共类型全部复用 GPU</tspan><tspan x="1420" dy="24">Ascend 只保留 C128 KV 特例</tspan></text>
</svg>
