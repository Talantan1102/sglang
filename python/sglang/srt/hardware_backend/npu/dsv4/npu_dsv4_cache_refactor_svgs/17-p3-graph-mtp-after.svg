<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="500" viewBox="0 0 1750 500" role="img" aria-labelledby="title desc">
  <title id="title">子改动三重构后：Graph和MTP复用GPU语义</title><desc id="desc">Graph复用子改动二字典和helper保存固定tensor；地址和ring size复用GPU公共实现，accepted长度复用现有runtime。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>text{font-family:"trebuchet ms",Verdana,Arial,sans-serif;fill:#0F172A;text-anchor:middle;font-size:16px}.n{fill:#F4F5F7;stroke:#6B7280;stroke-width:1.5}.r{fill:#E8F1FB;stroke:#3B82F6;stroke-width:1.5}.a{fill:#E8F7EE;stroke:#22A06B;stroke-width:1.5}.c{fill:#FFF4D6;stroke:#D97706;stroke-width:1.5}.d{fill:#FDECEC;stroke:#D14343;stroke-width:2;stroke-dasharray:5 3}.o{fill:#EEE8FF;stroke:#7C3AED;stroke-width:2}.e{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs>
  <path class="e" d="M250 110H290V160H330"/><path class="e" d="M250 230H290V205H330"/><path class="e" d="M250 390H600"/><path class="e" d="M630 185C730 185 730 215 830 215"/><path class="e" d="M850 390C900 390 900 250 830 250"/><path class="e" d="M1110 230H1190"/><path class="e" d="M1430 230H1510"/>
  <rect class="n" x="20" y="66" width="230" height="88" rx="4"/><text x="135" y="104"><tspan x="135">Graph capture/replay</tspan><tspan x="135" dy="24">固定 tensor 地址</tspan></text>
  <rect class="r" x="20" y="186" width="230" height="88" rx="4"/><text x="135" y="218"><tspan x="135">复用 GPU 公共实现</tspan><tspan x="135" dy="22">CompressStatePool translate</tspan><tspan x="135" dy="22">+ speculative ring size</tspan></text>
  <rect class="n" x="20" y="346" width="230" height="88" rx="4"/><text x="135" y="384"><tspan x="135">Target verify</tspan><tspan x="135" dy="24">committed + draft positions</tspan></text>
  <rect class="r" x="330" y="126" width="300" height="118" rx="4"/><text x="480" y="154"><tspan x="480">复用 ForwardMetadata 字典</tspan><tspan x="480" dy="22">ratio=4 / 128 固定 tensor</tspan><tspan x="480" dy="22">replay 原地 copy_</tspan><tspan x="480" dy="22">idle / padding = dummy</tspan></text>
  <rect class="r" x="600" y="346" width="250" height="88" rx="4"/><text x="725" y="384"><tspan x="725">复用子改动 2 helper</tspan><tspan x="725" dy="24">按 committed + draft 组表</tspan></text>
  <rect class="c" x="830" y="186" width="280" height="88" rx="4"/><text x="970" y="224"><tspan x="970">Graph compressor</tspan><tspan x="970" dy="24">二维 loc table + mode 2</tspan></text>
  <rect class="r" x="1190" y="186" width="240" height="88" rx="4"/><text x="1310" y="218"><tspan x="1310">复用现有 runtime</tspan><tspan x="1310" dy="22">accepted 更新 seq_lens</tspan><tspan x="1310" dy="22">rejected 下轮自然覆盖</tspan></text>
  <rect class="o" x="1510" y="186" width="220" height="88" rx="4"/><text x="1620" y="224"><tspan x="1620">Graph/MTP 与 Eager</tspan><tspan x="1620" dy="24">共享 state_loc 语义</tspan></text>
  <rect class="d" x="1190" y="340" width="240" height="72" rx="4"/><text x="1310" y="370"><tspan x="1310">删除 Graph 旧 metadata</tspan><tspan x="1310" dy="24">state page table / loc</tspan></text>
