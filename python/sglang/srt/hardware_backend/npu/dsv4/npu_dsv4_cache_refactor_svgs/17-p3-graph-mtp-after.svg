<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="470" viewBox="0 0 2000 470" role="img" aria-labelledby="title desc">
  <title id="title">子改动三重构后</title><desc id="desc">Graph 固定一维 bank tensor，MTP 以 committed start_pos 和 accepted 长度覆盖 rejected suffix。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748B"/></marker><style>.h{font:700 25px sans-serif;fill:#0F172A}.p{font:15px sans-serif;fill:#475569}.b{rx:12;ry:12;stroke-width:2}.gray{fill:#F4F5F7;stroke:#6B7280}.green{fill:#E8F7EE;stroke:#22A06B}.orange{fill:#FFF4D6;stroke:#D97706}.red{fill:#FDECEC;stroke:#D14343;stroke-dasharray:7 5}.purple{fill:#EEE8FF;stroke:#7C3AED}.t{font:700 16px sans-serif;fill:#0F172A;text-anchor:middle}.s{font:14px sans-serif;fill:#334155;text-anchor:middle}.e{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <text x="35" y="45" class="h">子改动 3 重构后：Graph/MTP ring + 剩余 metadata 删除</text><text x="35" y="75" class="p">Graph 固定一维 bank，MTP 原位覆盖 rejected suffix；同步删除两张 state table 和所有剩余 hooks。</text>
  <rect x="35" y="115" width="280" height="95" class="b gray"/><text x="175" y="152" class="t">Graph capture</text><text x="175" y="181" class="s">max_graph_bs</text>
  <rect x="365" y="105" width="330" height="115" class="b green"/><text x="530" y="143" class="t">compress_state_bank</text><text x="530" y="173" class="s">INT32[max_graph_bs]</text><text x="530" y="200" class="s">地址固定</text>
  <rect x="750" y="105" width="300" height="115" class="b orange"/><text x="900" y="143" class="t">Replay copy_</text><text x="900" y="173" class="s">动态 bank</text><text x="900" y="200" class="s">idle/padding=0</text>
  <rect x="35" y="300" width="280" height="95" class="b gray"/><text x="175" y="337" class="t">Target verify</text><text x="175" y="366" class="s">committed + draft count</text>
  <rect x="365" y="285" width="330" height="125" class="b orange"/><text x="530" y="323" class="t">Verify metadata</text><text x="530" y="353" class="s">start_pos=committed</text><text x="530" y="380" class="s">seqused=draft count</text>
  <rect x="1120" y="175" width="300" height="120" class="b orange"/><text x="1270" y="213" class="t">Graph Compressor</text><text x="1270" y="243" class="s">cache_mode=2</text><text x="1270" y="270" class="s">固定 ring state_cache</text>
  <rect x="1480" y="165" width="310" height="140" class="b green"/><text x="1635" y="203" class="t">Accepted overwrite</text><text x="1635" y="233" class="s">下一轮只推进 accepted</text><text x="1635" y="260" class="s">rejected suffix</text><text x="1635" y="287" class="s">相同绝对位置覆盖</text>
  <rect x="1840" y="185" width="130" height="100" class="b purple"/><text x="1905" y="223" class="t">结果</text><text x="1905" y="253" class="s">统一 ring</text>
  <path d="M315 162H365M695 162H750M1050 162H1085V210H1120M315 347H365M695 347H1085V260H1120M1420 235H1480M1790 235H1840" class="e"/>
  <rect x="1120" y="345" width="670" height="80" class="b red"/><text x="1455" y="377" class="t">随 Graph/MTP ring 切换同步删除</text><text x="1455" y="405" class="s">state page/loc graph buffers · 两张 state table · write/free/rollback hooks</text>
</svg>
