<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="460" viewBox="0 0 1950 460" role="img" aria-labelledby="title desc">
  <title id="title">子改动二重构后</title><desc id="desc">Eager Compressor 使用共享一维 request bank 和三个 ring pool。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748B"/></marker><style>.h{font:700 25px sans-serif;fill:#0F172A}.p{font:15px sans-serif;fill:#475569}.b{rx:12;ry:12;stroke-width:2}.gray{fill:#F4F5F7;stroke:#6B7280}.blue{fill:#E8F1FB;stroke:#3B82F6}.green{fill:#E8F7EE;stroke:#22A06B}.orange{fill:#FFF4D6;stroke:#D97706}.red{fill:#FDECEC;stroke:#D14343;stroke-dasharray:7 5}.purple{fill:#EEE8FF;stroke:#7C3AED}.t{font:700 16px sans-serif;fill:#0F172A;text-anchor:middle}.s{font:14px sans-serif;fill:#334155;text-anchor:middle}.e{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <text x="35" y="45" class="h">子改动 2 重构后：Eager ring + 旧 metadata 删除</text><text x="35" y="75" class="p">每 batch 派生一次 INT32 bank；复用现有 pool 路由，同时删除 Eager state 写表和 page-table 链。</text>
  <rect x="30" y="170" width="280" height="100" class="b gray"/><text x="170" y="208" class="t">Eager ForwardBatch</text><text x="170" y="238" class="s">req_pool_indices / cu_seqlens</text>
  <rect x="360" y="105" width="300" height="100" class="b orange"/><text x="510" y="143" class="t">compress_state_bank[B]</text><text x="510" y="173" class="s">每 batch 一次 INT64→INT32</text>
  <rect x="360" y="255" width="300" height="110" class="b orange"/><text x="510" y="293" class="t">Sequence metadata</text><text x="510" y="323" class="s">start_pos / seqused</text><text x="510" y="350" class="s">prefill 显式有效长度</text>
  <rect x="715" y="170" width="300" height="100" class="b blue"/><text x="865" y="208" class="t">复用 get_state_cache()</text><text x="865" y="238" class="s">layer_id / is_in_indexer</text>
  <rect x="1070" y="155" width="330" height="130" class="b orange"/><text x="1235" y="193" class="t">custom.compressor</text><text x="1235" y="223" class="s">state_block_table=bank</text><text x="1235" y="250" class="s">cache_mode=2</text>
  <rect x="1455" y="170" width="260" height="100" class="b blue"/><text x="1585" y="208" class="t">NPU Epilog</text><text x="1585" y="238" class="s">原链路复用</text>
  <rect x="1770" y="170" width="150" height="100" class="b purple"/><text x="1845" y="208" class="t">结果</text><text x="1845" y="238" class="s">Ring state</text>
  <path d="M310 205H335V155H360M310 235H335V310H360M660 155H1030V195H1070M660 310H1030V245H1070M660 220H715M1015 220H1070M1400 220H1455M1715 220H1770" class="e"/>
  <rect x="715" y="345" width="685" height="75" class="b red"/><text x="1057" y="375" class="t">随 Eager ring 切换同步删除</text><text x="1057" y="402" class="s">state loc 写表 hook · c4/c128_state_page_table 构造与消费</text>
</svg>
