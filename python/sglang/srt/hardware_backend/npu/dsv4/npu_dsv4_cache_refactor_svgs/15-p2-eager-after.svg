<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="450" viewBox="0 0 1900 450" role="img" aria-labelledby="title desc">
  <title id="title">子改动二重构后：复用GPU地址计算并适配A3调用格式</title><desc id="desc">C4和C128地址复用GPU公共translate；通用A3 adapter按ratio临时组装二维state_block_table，不新增长期request table。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>text{font-family:"trebuchet ms",Verdana,Arial,sans-serif;fill:#0F172A;text-anchor:middle;font-size:16px}.n{fill:#F4F5F7;stroke:#6B7280;stroke-width:1.5}.r{fill:#E8F1FB;stroke:#3B82F6;stroke-width:1.5}.c{fill:#FFF4D6;stroke:#D97706;stroke-width:1.5}.d{fill:#FDECEC;stroke:#D14343;stroke-width:2;stroke-dasharray:5 3}.o{fill:#EEE8FF;stroke:#7C3AED;stroke-width:2}.e{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs>
  <path class="e" d="M260 205H290V105H320"/><path class="e" d="M260 225H290V305H320"/><path class="e" d="M620 105C660 105 660 190 700 190"/><path class="e" d="M620 305C660 305 660 240 700 240"/><path class="e" d="M1020 215H1090"/><path class="e" d="M1360 215H1420"/><path class="e" d="M1660 215H1710"/>
  <rect class="n" x="20" y="171" width="240" height="88" rx="4"/><text x="140" y="209"><tspan x="140">Eager ForwardBatch</tspan><tspan x="140" dy="24">full loc / req / positions</tspan></text>
  <rect class="r" x="320" y="61" width="300" height="88" rx="4"/><text x="470" y="87"><tspan x="470">[复用 GPU] C4 state_loc</tspan><tspan x="470" dy="22">full→SWA→translate</tspan><tspan x="470" dy="22">C4A/C4Li 共用</tspan></text>
  <rect class="r" x="320" y="261" width="300" height="88" rx="4"/><text x="470" y="287"><tspan x="470">[复用 GPU] C128 state_loc</tspan><tspan x="470" dy="22">req + position→translate</tspan><tspan x="470" dy="22">C128A 使用</tspan></text>
  <rect class="c" x="700" y="161" width="320" height="108" rx="4"/><text x="860" y="189"><tspan x="860">通用 A3 adapter</tspan><tspan x="860" dy="22">按 ratio 每 batch 组装一次</tspan><tspan x="860" dy="22">二维 state_block_table</tspan><tspan x="860" dy="22">仅本轮调用 tensor</tspan></text>
  <rect class="c" x="1090" y="171" width="270" height="88" rx="4"/><text x="1225" y="209"><tspan x="1225">custom.compressor</tspan><tspan x="1225" dy="24">cache_mode=2</tspan></text>
  <rect class="r" x="1420" y="171" width="240" height="88" rx="4"/><text x="1540" y="209"><tspan x="1540">GPU ring state pool</tspan><tspan x="1540" dy="24">更新对应 state rows</tspan></text>
  <rect class="o" x="1710" y="171" width="170" height="88" rx="4"/><text x="1795" y="209"><tspan x="1795">compressed KV</tspan><tspan x="1795" dy="24">+ ring state</tspan></text>
  <rect class="d" x="700" y="330" width="320" height="72" rx="4"/><text x="860" y="361"><tspan x="860">删除 paged state metadata</tspan><tspan x="860" dy="22">不新增长期 loc/request table</tspan></text>
</svg>
