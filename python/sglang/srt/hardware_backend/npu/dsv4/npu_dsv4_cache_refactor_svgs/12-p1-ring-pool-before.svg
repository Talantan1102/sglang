<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="400" viewBox="0 0 1800 400" role="img" aria-labelledby="title desc">
  <title id="title">子改动一重构前</title><desc id="desc">分页 state pool 由 sizing、state allocator、lens 和 loc 管理。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748B"/></marker><style>.h{font:700 25px sans-serif;fill:#0F172A}.p{font:15px sans-serif;fill:#475569}.b{rx:12;ry:12;stroke-width:2}.gray{fill:#F4F5F7;stroke:#6B7280}.red{fill:#FDECEC;stroke:#D14343;stroke-dasharray:7 5}.orange{fill:#FFF4D6;stroke:#D97706}.purple{fill:#EEE8FF;stroke:#7C3AED}.t{font:700 16px sans-serif;fill:#0F172A;text-anchor:middle}.s{font:14px sans-serif;fill:#334155;text-anchor:middle}.e{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <text x="35" y="45" class="h">子改动 1 重构前：Paged state ownership</text><text x="35" y="75" class="p">Pool sizing、state allocator、DSV4StateLens 和 state loc 共同拥有分页 state 地址。</text>
  <rect x="40" y="145" width="280" height="100" class="b gray"/><text x="180" y="183" class="t">配置输入</text><text x="180" y="213" class="s">max requests / page / ratio</text>
  <rect x="375" y="145" width="300" height="100" class="b red"/><text x="525" y="183" class="t">npu_state_pool_size()</text><text x="525" y="213" class="s">计算 paged slot 数</text>
  <rect x="730" y="135" width="330" height="120" class="b orange"/><text x="895" y="175" class="t">NPUCompressStatePool</text><text x="895" y="205" class="s">保留类；当前为 paged layout</text><text x="895" y="232" class="s">[blocks, page_size, last_dim]</text>
  <rect x="1115" y="135" width="300" height="120" class="b red"/><text x="1265" y="173" class="t">State Allocator/Lens/Loc</text><text x="1265" y="203" class="s">alloc/free/evict</text><text x="1265" y="230" class="s">DSV4OutCacheLoc state fields</text>
  <rect x="1470" y="145" width="290" height="100" class="b purple"/><text x="1615" y="183" class="t">结果</text><text x="1615" y="213" class="s">token/page ownership</text>
  <path d="M320 195H375M675 195H730M1060 195H1115M1415 195H1470" class="e"/>
